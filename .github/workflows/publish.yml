name: Publish Package to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (simulate publish without uploading to npm)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ensure modern npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Run checks (typecheck, lint, test)
        run: npm run prepublishOnly

      - name: Build package
        run: npm run build

      - name: Publish to npm (Dry Run)
        if: ${{ inputs.dry_run == true }}
        run: npm publish --dry-run

      - name: Publish to npm (Production with Provenance)
        if: ${{ inputs.dry_run != true }}
        run: npm publish --provenance --access public
